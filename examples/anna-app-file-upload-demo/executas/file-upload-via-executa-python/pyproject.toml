[project]
name = "tool-test-file-upload-12345678"
version = "0.2.5"
description = "Self-contained demo Executa for transient host/uploadFile reverse-RPC and concurrency diagnostics."
requires-python = ">=3.10"
authors = [{ name = "Anna Developer" }]
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
build = [
  "pyinstaller>=6.0.0",
]

[project.scripts]
# The script name MUST equal `project.name` (= the local dev tool id), because
# `anna-app dev` starts it with `uv run --project <dir> <project-script>`.
"tool-test-file-upload-12345678" = "file_upload_via_executa_plugin:main"

[tool.hatch.build.targets.wheel]
packages = ["."]
only-include = ["file_upload_via_executa_plugin.py", "host_upload_client.py"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
